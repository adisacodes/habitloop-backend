services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: habitloop
      POSTGRES_USER: habitloop_user
      POSTGRES_PASSWORD: habitloop_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitloop_user -d habitloop"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: habitloop
      POSTGRES_USER: habitloop_user
      POSTGRES_PASSWORD: habitloop_pass
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

volumes:
  postgres_data: